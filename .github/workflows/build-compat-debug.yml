name: Pict2Cam compatibility debug (API 29-36)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install SDK
        run: sdkmanager "platforms;android-33" "build-tools;33.0.2"
      - name: Build debug APK and save log
        id: build
        continue-on-error: true
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee build-debug.log
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pict2Cam-build-diagnostics
          path: build-debug.log
          if-no-files-found: warn
      - name: Upload APK when available
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Pict2Cam-compat-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Fail on build error
        if: steps.build.outcome == 'failure'
        run: exit 1
